<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Portal ADMIN - Peminjaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div id="loginPage" class="flex items-center justify-center min-h-screen">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-slate-800">
        <h2 class="text-2xl font-bold text-center mb-2">Login Khusus Admin</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Email Admin</label>
            <input
              type="email"
              id="email"
              class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-slate-800 outline-none"
              placeholder="admin@kampus.ac.id"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Password</label>
            <input
              type="password"
              id="password"
              class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-slate-800 outline-none"
            />
          </div>
          <button
            type="button"
            onclick="prosesAuth()"
            class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 transition"
          >
            Masuk Admin
          </button>
        </div>
      </div>
    </div>

    <div id="dashboardPage" class="hidden max-w-7xl mx-auto p-6">
      <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800 text-white p-5 rounded-2xl shadow-md mb-8">
        <div>
          <h1 class="text-xl font-bold">🛠️ Dashboard Administrator</h1>
          <p id="userEmailDisplay" class="text-sm text-slate-400"></p>
        </div>
        <div class="flex gap-3 mt-4 md:mt-0">
          <button
            onclick="switchTab('persetujuan')"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 hover:bg-slate-600"
          >
            Data Peminjaman
          </button>
          <button
            onclick="switchTab('barang')"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 hover:bg-slate-600"
          >
            Kelola Barang
          </button>
          <button
            onclick="logout()"
            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-rose-600 hover:bg-rose-700"
          >
            Keluar
          </button>
        </div>
      </div>

      <div id="tabPersetujuan">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-4">Daftar Pengajuan Peminjaman</h2>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-sm text-slate-600 border-b">
                <th class="p-4">Peminjam</th>
                <th class="p-4">Barang</th>
                <th class="p-4">Jadwal</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-center">Aksi Admin</th>
              </tr>
            </thead>
            <tbody id="tabelPeminjaman" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>

      <div id="tabBarang" class="hidden">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 h-fit">
            <h2 class="text-lg font-bold mb-4">➕ Tambah Barang</h2>
            <form id="formTambahBarang" class="space-y-4">
              <input
                type="text"
                id="namaBarang"
                required
                class="w-full p-3 border rounded-xl"
                placeholder="Nama Barang"
              />
              <select id="kategoriBarang" class="w-full p-3 border rounded-xl">
                <option>Elektronik</option>
                <option>Ruangan</option>
                <option>Aksesori</option>
                <option>ATK</option>
              </select>
              <input
                type="number"
                id="stokBarang"
                required
                min="1"
                class="w-full p-3 border rounded-xl"
                placeholder="Total Stok"
              />
              <textarea
                id="deskripsiBarang"
                required
                class="w-full p-3 border rounded-xl"
                placeholder="Deskripsi"
              ></textarea>
              <button
                type="submit"
                class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl"
              >
                Simpan Barang
              </button>
            </form>
          </div>
          <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 text-sm border-b">
                  <th class="p-3">Nama</th>
                  <th class="p-3">
