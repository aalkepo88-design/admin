<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Portal ADMIN - Peminjaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div id="loginPage" class="flex items-center justify-center min-h-screen">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-slate-800">
        <h2 class="text-2xl font-bold text-center mb-2">Login Khusus Admin</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Email Admin</label>
            <input
              type="email"
              id="email"
              class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-slate-800 outline-none"
              placeholder="admin@kampus.ac.id"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Password</label>
            <input
              type="password"
              id="password"
              class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-slate-800 outline-none"
            />
          </div>
          <button
            type="button"
            onclick="prosesAuth()"
            class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 transition"
          >
            Masuk Admin
          </button>
        </div>
      </div>
    </div>

    <div id="dashboardPage" class="hidden max-w-7xl mx-auto p-6">
      <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800 text-white p-5 rounded-2xl shadow-md mb-8">
        <div>
          <h1 class="text-xl font-bold">🛠️ Dashboard Administrator</h1>
          <p id="userEmailDisplay" class="text-sm text-slate-400"></p>
        </div>
        <div class="flex gap-3 mt-4 md:mt-0">
          <button
            onclick="switchTab('persetujuan')"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 hover:bg-slate-600"
          >
            Data Peminjaman
          </button>
          <button
            onclick="switchTab('barang')"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 hover:bg-slate-600"
          >
            Kelola Barang
          </button>
          <button
            onclick="logout()"
            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-rose-600 hover:bg-rose-700"
          >
            Keluar
          </button>
        </div>
      </div>

      <div id="tabPersetujuan">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-4">Daftar Pengajuan Peminjaman</h2>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-sm text-slate-600 border-b">
                <th class="p-4">Peminjam</th>
                <th class="p-4">Barang</th>
                <th class="p-4">Jadwal</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-center">Aksi Admin</th>
              </tr>
            </thead>
            <tbody id="tabelPeminjaman" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>

      <div id="tabBarang" class="hidden">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 h-fit">
            <h2 class="text-lg font-bold mb-4">➕ Tambah Barang</h2>
            <form id="formTambahBarang" class="space-y-4">
              <input
                type="text"
                id="namaBarang"
                required
                class="w-full p-3 border rounded-xl"
                placeholder="Nama Barang"
              />
              <select id="kategoriBarang" class="w-full p-3 border rounded-xl">
                <option>Elektronik</option>
                <option>Ruangan</option>
                <option>Aksesori</option>
                <option>ATK</option>
              </select>
              <input
                type="number"
                id="stokBarang"
                required
                min="1"
                class="w-full p-3 border rounded-xl"
                placeholder="Total Stok"
              />
              <textarea
                id="deskripsiBarang"
                required
                class="w-full p-3 border rounded-xl"
                placeholder="Deskripsi"
              ></textarea>
              <button
                type="submit"
                class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl"
              >
                Simpan Barang
              </button>
            </form>
          </div>
          <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 text-sm border-b">
                  <th class="p-3">Nama</th>
                  <th class="p-3">Kategori</th>
                  <th class="p-3">Stok</th>
                  <th class="p-3">Aksi</th>
                </tr>
              </thead>
              <tbody id="tabelDatabaseBarang" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      const DB_BARANG_URL = "https://smfcjjicyjfqmwlisujt.supabase.co";
      const DB_BARANG_KEY = "sb_publishable_KLAYYsK0DDAAvDDsEzZdAA_EB_XBHmr";
      const clientBarang = window.supabase.createClient(
        DB_BARANG_URL,
        DB_BARANG_KEY,
      );

      const DB_PINJAM_URL = "https://wbhlnvdigjrwipovinjk.supabase.co";
      const DB_PINJAM_KEY = "sb_publishable_YppIn9hZwuKSeDjIOz5vSQ_LJpsaDwX";
      const clientPinjam = window.supabase.createClient(
        DB_PINJAM_URL,
        DB_PINJAM_KEY,
        {
          auth: { storageKey: "sesi_admin" },
        },
      );

      async function prosesAuth() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const { error } = await clientPinjam.auth.signInWithPassword({
          email,
          password,
        });
        if (error) alert("Gagal Login: " + error.message);
        else cekSesi();
      }

      async function logout() {
        await clientPinjam.auth.signOut();
        window.location.reload();
      }

      async function cekSesi() {
        const {
          data: { user },
        } = await clientPinjam.auth.getUser();
        if (user) {
          document.getElementById("loginPage").classList.add("hidden");
          document.getElementById("dashboardPage").classList.remove("hidden");
          document.getElementById("userEmailDisplay").innerText =
            "Admin: " + user.email;
          muatPeminjaman();
          muatDataBarang();
        }
      }

      function switchTab(tab) {
        document
          .getElementById("tabPersetujuan")
          .classList.toggle("hidden", tab !== "persetujuan");
        document
          .getElementById("tabBarang")
          .classList.toggle("hidden", tab !== "barang");
        if (tab === "persetujuan") muatPeminjaman();
        if (tab === "barang") muatDataBarang();
      }

      async function muatPeminjaman() {
        const { data: dataBarang } = await clientBarang
          .from("barang")
          .select("id, stok_tersedia");
        let mapStok = {};
        if (dataBarang)
          dataBarang.forEach((b) => (mapStok[b.id] = b.stok_tersedia));

        const { data } = await clientPinjam
          .from("peminjaman")
          .select("*")
          .order("id", { ascending: false });
        const container = document.getElementById("tabelPeminjaman");

        container.innerHTML = "";
        if (data) {
          data.forEach((item) => {
            let stokSaatIni = mapStok[item.barang_id] || 0;
            let badge =
              item.status === "Pending"
                ? "bg-amber-100 text-amber-700"
                : item.status === "Approved"
                  ? "bg-blue-100 text-blue-700"
                  : item.status === "Selesai"
                    ? "bg-emerald-100 text-emerald-700"
                    : "bg-rose-100 text-rose-700";

            let tombol = "";
            if (item.status === "Pending") {
              tombol = `<button onclick="setujui(${item.id}, ${item.barang_id}, ${stokSaatIni})" class="px-2 py-1 bg-blue-600 text-white rounded text-xs mr-1">Setuju</button><button onclick="tolak(${item.id})" class="px-2 py-1 bg-rose-600 text-white rounded text-xs">Tolak</button>`;
            } else if (item.status === "Approved") {
              tombol = `<button onclick="selesai(${item.id}, ${item.barang_id}, ${stokSaatIni})" class="px-2 py-1 bg-emerald-600 text-white rounded text-xs">Selesai</button>`;
            }

            container.innerHTML += `
            <tr class="hover:bg-slate-50 border-b">
              <td class="p-4"><div class="font-bold">${item.nama_peminjam}</div><div class="text-xs text-slate-500">${item.nim_nipy || "-"}</div></td>
              <td class="p-4"><div class="font-bold">${item.nama_barang_pinjam || "Barang"}</div><div class="text-xs text-slate-500">${item.keperluan}</div></td>
              <td class="p-4 text-xs">${item.tgl_pinjam} <br>s.d<br> ${item.tgl_kembali}</td>
              <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${badge}">${item.status}</span></td>
              <td class="p-4 text-center">${tombol || "-"}</td>
            </tr>`;
          });
        }
      }

      async function setujui(idPinjam, idBarang, stokSaatIni) {
        if (stokSaatIni <= 0) return alert("Stok barang habis!");
        if (confirm("Setujui peminjaman ini?")) {
          await clientPinjam
            .from("peminjaman")
            .update({ status: "Approved" })
            .eq("id", idPinjam);
          
          await clientBarang
            .from("barang")
            .update({ stok_tersedia: stokSaatIni - 1 })
            .eq("id", idBarang);
            
          muatPeminjaman();
        }
      }

      async function tolak(idPinjam) {
        let alasan = prompt("Alasan penolakan:");
        if (alasan) {
          await clientPinjam
            .from("peminjaman")
            .update({ status: "Ditolak", alasan_penolakan: alasan })
            .eq("id", idPinjam);
          muatPeminjaman();
        }
      }

      async function selesai(idPinjam, idBarang, stokSaatIni) {
        if (confirm("Tandai barang sudah dikembalikan?")) {
          await clientPinjam
            .from("peminjaman")
            .update({ status: "Selesai" })
            .eq("id", idPinjam);
          await clientBarang
            .from("barang")
            .update({ stok_tersedia: stokSaatIni + 1 })
            .eq("id", idBarang);
          muatPeminjaman();
        }
      }

      async function muatDataBarang() {
        const { data } = await clientBarang
          .from("barang")
          .select("*")
          .order("id", { ascending: false });
        const container = document.getElementById("tabelDatabaseBarang");
        container.innerHTML = "";
        if (data) {
          data.forEach((b) => {
            container.innerHTML += `<tr class="border-b"><td class="p-3 font-semibold">${b.nama_barang}</td><td class="p-3 text-xs">${b.kategori}</td><td class="p-3 font-bold">${b.stok_tersedia} / ${b.stok_total}</td><td class="p-3"><button onclick="hapusBarang(${b.id})" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded">Hapus</button></td></tr>`;
          });
        }
      }

      document
        .getElementById("formTambahBarang")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const stok = parseInt(document.getElementById("stokBarang").value);
          await clientBarang.from("barang").insert([
            {
              nama_barang: document.getElementById("namaBarang").value,
              kategori: document.getElementById("kategoriBarang").value,
              stok_total: stok,
              stok_tersedia: stok,
              deskripsi: document.getElementById("deskripsiBarang").value,
            },
          ]);
          document.getElementById("formTambahBarang").reset();
          muatDataBarang();
        });

      async function hapusBarang(id) {
        if (confirm("Hapus barang ini?")) {
          await clientBarang.from("barang").delete().eq("id", id);
          muatDataBarang();
        }
      }

      cekSesi();
    </script>
  </body>
</html>
